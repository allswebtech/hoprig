name: windows

# Windows on demand (and on branches named windows/…), with a choice of files. test.yml runs the whole suite on
# Windows at every push as a job that is allowed to fail, until it passes and is made required.
on:
  workflow_dispatch:
    inputs:
      files:
        description: Test folders or files to run (empty = all)
        required: false
        default: ''
  push:
    branches: ['windows/**']

permissions:
  contents: read

jobs:
  test:
    name: windows-latest · node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node tools/test.mjs ${{ github.event.inputs.files }}
