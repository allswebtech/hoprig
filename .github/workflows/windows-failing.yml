name: windows-failing

# On the Windows work branch only: the test files that failed in the last whole run, in three chunks, so a mend is
# seen in minutes instead of after the whole run. It tells, it does not block. Never part of a release.
on:
  pull_request:

permissions:
  contents: read

jobs:
  failing:
    name: windows failing files · chunk ${{ matrix.chunk }}
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - shell: bash
        run: |
          mapfile -t FILES < <(awk -v c=${{ matrix.chunk }} 'NR % 3 == c' .github/windows-failing.txt | tr -d '\r')
          echo "${#FILES[@]} files in this chunk"
          node tools/test.mjs "${FILES[@]}"
