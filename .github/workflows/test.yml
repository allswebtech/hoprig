name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}${{ matrix.part != '1/1' && format(' · part {0}', matrix.part) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
        part: ['1/1']
        # macOS is the slow one (three CPUs, slow process starts): its run is split into three parts side by side.
        exclude:
          - os: macos-latest
            part: '1/1'
        include:
          - { os: macos-latest, node: 24, part: '1/3' }
          - { os: macos-latest, node: 24, part: '2/3' }
          - { os: macos-latest, node: 24, part: '3/3' }
          - { os: macos-latest, node: 26, part: '1/3' }
          - { os: macos-latest, node: 26, part: '2/3' }
          - { os: macos-latest, node: 26, part: '3/3' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: tmux (the end-to-end test also runs on it where it exists)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm test -- --part=${{ matrix.part }}

  # Windows is not supported yet: its jobs tell, they do not block. Their results are shown, a failure does not fail
  # the run. The same Node.js versions as above (24, the lowest Hoprig runs on, and 26). Every test process
  # gets a home of its own there (USERPROFILE, APPDATA, LOCALAPPDATA in the run's temporary folder), and the runner
  # fails by name when a test still wrote into the real profile (tools/home-guard.mjs).
  windows:
    name: windows-latest · node ${{ matrix.node }} · part ${{ matrix.part }} (allowed to fail)
    # Windows is slower still (a whole run took 45 minutes on Node 24 and passed the hour on Node 26): three parts side
    # by side, as on macOS, each with the same limit as the other jobs.
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        part: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test -- --part=${{ matrix.part }}
