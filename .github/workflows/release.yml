name: release

# A release is a tag: v<version>, equal to package.json's version, on a commit of main, with a section for that version
# in the changelog (site/content/changelog.md). On such a tag: the tests, then the GitHub release with that section as
# its notes, then both packages (hoprig and hoprig-skill) on npm with provenance, through npm's trusted publishing: no
# npm token is stored anywhere. Publishing waits for the owner: it runs only when the repository variable NPM_PUBLISH
# is "on", which he sets once the trusted publisher is set up on npmjs.com (RELEASING.md). Until then the release is
# made and nothing is published, and the run's summary says so.
#
# Every step can run again: a release or a package version that is there already is skipped, so "Re-run failed jobs"
# finishes a release that stopped half-way, and "Run workflow" from a tag publishes one that was released while
# publishing was off (it goes through the same checks and tests).
#
# "Run workflow" is started FROM the tag ("Use workflow from" set to it), never from a branch with the tag typed in:
# npm's provenance names the run's own ref and commit, not the tree that was checked out, so a run from main would
# publish the tag's files with a statement that they were built from main's newest commit. The check job refuses such
# a run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    name: tag, changelog and tests
    if: github.repository == 'allswebtech/hoprig'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: The run is the tag's own (its provenance names the tag's commit)
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is for $GITHUB_REF, not a tag. Start \"Run workflow\" with \"Use workflow from\" set to the release tag (RELEASING.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # main's history: the tag's commit must be on it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag is the version, and the changelog has its section
        run: node tools/release-notes.mjs "$TAG" --out "$RUNNER_TEMP/notes.md"
      - name: The tag's commit is on main
        run: |
          if ! git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main; then
            echo "::error::The commit of $TAG is not on main. A release is a tag on a commit of main (RELEASING.md)."
            exit 1
          fi
      - name: tmux (the end-to-end test also runs on it)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm test

  release:
    name: GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The release notes, from the changelog
        run: node tools/release-notes.mjs "$TAG" --out "$RUNNER_TEMP/notes.md"
      - name: The release (skipped when it is there already)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release $TAG is there already: left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Hoprig ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  publish:
    name: npm (trusted publishing)
    needs: release
    if: vars.NPM_PUBLISH == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named in the trusted publisher on npmjs.com: npm then trusts only runs of this job, and the environment's own
    # rules (a required reviewer, if the owner sets one) hold before anything is published.
    environment: npm
    permissions:
      contents: read
      id-token: write # the short-lived identity npm checks against the trusted publisher; no token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: An npm that publishes by trusted publishing (11.5.1 or later)
        run: |
          if node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm --version
          else
            npm install -g npm@11.6.2
          fi
      - name: hoprig
        run: |
          if [ "$(npm view "hoprig@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ]; then
            echo "hoprig ${TAG#v} is on npm already: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
            echo "Published hoprig ${TAG#v} to npm, with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: hoprig-skill
        working-directory: packages/hoprig-skill
        run: |
          if [ "$(npm view "hoprig-skill@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ]; then
            echo "hoprig-skill ${TAG#v} is on npm already: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
            echo "Published hoprig-skill ${TAG#v} to npm, with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi

  not-published:
    name: npm (waiting for the owner)
    needs: release
    if: vars.NPM_PUBLISH != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say that nothing was published
        run: |
          {
            echo "The GitHub release ${TAG} is made. Nothing was published to npm:"
            echo "the repository variable NPM_PUBLISH is not \"on\". The one-time step is in RELEASING.md; then"
            echo "Actions → release → Run workflow, with \"Use workflow from\" set to the tag ${TAG}, publishes this release."
          } >> "$GITHUB_STEP_SUMMARY"
